<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Online Course{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">OnlineCourse</a>
        <div class="ms-auto d-flex gap-2 align-items-center">
            {% if user.is_authenticated %}
                <span class="navbar-text text-white">{{ user.username }}</span>
                <a class="btn btn-outline-light btn-sm" href="{% url 'onlinecourse:logout' %}">Logout</a>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'onlinecourse:login' %}">Login</a>
                <a class="btn btn-primary btn-sm" href="{% url 'onlinecourse:registration' %}">Register</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container py-5">
    {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
